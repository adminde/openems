@if (isInitialized) {
  <oe-flat-widget [title]="'GENERAL.THERMAL_STORAGE_SYSTEM'| translate"
    link="/device/{{edge.id}}/history/thermalstoragechart" [icon]="{name: 'flame', color: 'heat', size: 'large'}">
    <oe-flat-widget-line [name]="'GENERAL.CHARGE' | translate" channelAddress="_sum/TessThermalChargeEnergy"
    [converter]="Utils.CONVERT_TO_KILO_WATTHOURS"></oe-flat-widget-line>
    <oe-flat-widget-line [name]="'GENERAL.DISCHARGE' | translate" channelAddress="_sum/TessThermalDischargeEnergy"
    [converter]="Utils.CONVERT_TO_KILO_WATTHOURS"></oe-flat-widget-line>
  </oe-flat-widget>
}
